site_name: poly-harness-dispatcher (PHD)
site_description: Spawn headless AI coding agents (Claude Code, Codex, OpenCode) from one harness-neutral spec.
repo_url: https://github.com/Stateous/poly-harness-dispatcher
repo_name: Stateous/poly-harness-dispatcher
edit_uri: edit/main/docs/
docs_dir: docs
site_dir: site

# docs/superpowers/ holds local working notes (git-ignored); never publish it.
exclude_docs: |
  superpowers/

theme:
  name: material
  features:
    - navigation.sections
    - navigation.top
    - navigation.footer
    - content.code.copy
    - toc.follow
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/brightness-4
        name: Switch to light mode

markdown_extensions:
  - admonition
  - tables
  - attr_list
  - toc:
      permalink: true
  - pymdownx.highlight
  - pymdownx.inlinehilite
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          paths: [src]
          options:
            docstring_style: google
            show_source: false
            show_root_heading: true
            show_root_full_path: false
            members_order: source
            merge_init_into_class: true
            separate_signature: true
            show_signature_annotations: true
            signature_crossrefs: false
            filters: ["!^_"]
            heading_level: 3

nav:
  - Home: index.md
  - Getting started: getting-started.md
  - Concepts:
      - Stacks: concepts/stacks.md
      - Stack resolver: concepts/stack-resolver.md
      - Spec, Inputs, Credentials: concepts/spec-and-inputs.md
      - Harnesses: concepts/harnesses.md
      - Prompt assembly: concepts/prompt-assembly.md
      - Hooks: concepts/hooks.md
      - Run lifecycle: concepts/run-lifecycle.md
      - Results and events: concepts/results-and-events.md
      - Option combinations: concepts/combinations.md
      - Security and isolation: concepts/security-and-isolation.md
  - Architecture: architecture.md
  - Troubleshooting: troubleshooting.md
  - API reference:
      - Overview: reference/index.md
      - Spec and stack: reference/spec.md
      - Stack resolver: reference/stacks.md
      - Dispatcher: reference/dispatcher.md
      - Results: reference/results.md
      - Models: reference/models.md
      - Errors: reference/errors.md
  - Design record: CoreDesign.md
